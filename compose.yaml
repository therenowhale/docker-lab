services:
  app:
    build: .
    image: docker-lab-app:local
    ports:
      - "${HOST_PORT:-8088}:8080"
    environment:
      PORT: "8080"
    networks:
      - lab-net
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  client:
    image: alpine:3.22
    profiles: ["client"]
    command: ["sh", "-c", "sleep infinity"]
    networks:
      - lab-net
    depends_on:
      app:
        condition: service_healthy

networks:
  lab-net:
    driver: bridge

volumes:
  app-data:
